<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>o9 Badminton Premier League 2026 — Bangalore Fixtures</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --navy: #0b1528;
      --navy-mid: #162647;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --lime: #84cc16;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --fri-bg: #fef3c7;
      --fri-fg: #92400e;
      --sat-bg: #dbeafe;
      --sat-fg: #1e40af;
      --sun-bg: #dcfce7;
      --sun-fg: #166534;
      --ko-bg: #f3e8ff;
      --ko-fg: #6b21a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      color: #fff;
      padding: 28px 16px 36px;
      text-align: center;
      border-bottom: 3px solid var(--lime);
    }
    .hero-badge {
      display: inline-block;
      background: rgba(132, 204, 22, 0.16);
      color: #bef264;
      border: 1px solid rgba(132, 204, 22, 0.35);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .hero h1 {
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .hero p {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 4px;
    }
    .container {
      max-width: 820px;
      margin: -20px auto 48px;
      padding: 0 16px;
    }
    .search-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
    }
    .search-row {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-size: 18px;
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 14px 42px 14px 42px;
      font-size: 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #searchInput:focus {
      border-color: var(--accent);
      background: #fff;
    }
    .clear-btn {
      position: absolute;
      right: 12px;
      background: #e2e8f0;
      border: none;
      color: #475569;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .clear-btn.visible { display: flex; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .chip {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #bfdbfe;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover, .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 0 6px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #475569;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab:hover { border-color: #94a3b8; }
    .tab.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }
    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 2px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }
    .card.fri { border-left-color: #d97706; }
    .card.sat { border-left-color: #2563eb; }
    .card.sun { border-left-color: #16a34a; }
    .card.ko  { border-left-color: #7e22ce; }
    .card-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-fri { background: var(--fri-bg); color: var(--fri-fg); }
    .badge-sat { background: var(--sat-bg); color: var(--sat-fg); }
    .badge-sun { background: var(--sun-bg); color: var(--sun-fg); }
    .badge-ko  { background: var(--ko-bg);  color: var(--ko-fg); }
    .badge-court {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .cat-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
    }
    .matchup-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .team-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .team-line.highlight {
      color: var(--accent);
      font-weight: 800;
    }
    .role-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: #dbeafe;
      color: #1e40af;
      white-space: nowrap;
    }
    .role-tag.opp {
      background: #fee2e2;
      color: #991b1b;
    }
    .vs-divider {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .group-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .group-player {
      background: #fff;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .group-player.me {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1e3a8a;
      font-weight: 800;
    }
    .note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .empty {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 20px;
      color: var(--muted);
    }
    .empty strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 4px;
    }
  </style>
