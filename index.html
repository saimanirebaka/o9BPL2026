<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>o9 Badminton Premier League 2026 — Bangalore Fixtures</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --navy: #0b1528;
      --navy-mid: #162647;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --lime: #84cc16;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --fri-bg: #fef3c7;
      --fri-fg: #92400e;
      --sat-bg: #dbeafe;
      --sat-fg: #1e40af;
      --sun-bg: #dcfce7;
      --sun-fg: #166534;
      --ko-bg: #f3e8ff;
      --ko-fg: #6b21a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      color: #fff;
      padding: 28px 16px 36px;
      text-align: center;
      border-bottom: 3px solid var(--lime);
    }
    .hero-badge {
      display: inline-block;
      background: rgba(132, 204, 22, 0.16);
      color: #bef264;
      border: 1px solid rgba(132, 204, 22, 0.35);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .hero h1 {
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .hero p {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 4px;
    }
    .container {
      max-width: 820px;
      margin: -20px auto 48px;
      padding: 0 16px;
    }
    .search-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
    }
    .search-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .search-controls { grid-template-columns: 1fr; }
    }
    .search-row {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-size: 18px;
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 13px 40px 13px 42px;
      font-size: 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #searchInput:focus {
      border-color: var(--accent);
      background: #fff;
    }
    #playerSelect {
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      color: var(--text);
      outline: none;
      cursor: pointer;
      min-width: 210px;
    }
    #playerSelect:focus {
      border-color: var(--accent);
      background: #fff;
    }
    .clear-btn {
      position: absolute;
      right: 12px;
      background: #e2e8f0;
      border: none;
      color: #475569;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .clear-btn.visible { display: flex; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .chip {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #bfdbfe;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover, .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 0 6px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #475569;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab:hover { border-color: #94a3b8; }
    .tab.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }
    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 2px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }
    .card.fri { border-left-color: #d97706; }
    .card.sat { border-left-color: #2563eb; }
    .card.sun { border-left-color: #16a34a; }
    .card.ko  { border-left-color: #7e22ce; }
    .card-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-fri { background: var(--fri-bg); color: var(--fri-fg); }
    .badge-sat { background: var(--sat-bg); color: var(--sat-fg); }
    .badge-sun { background: var(--sun-bg); color: var(--sun-fg); }
    .badge-ko  { background: var(--ko-bg);  color: var(--ko-fg); }
    .badge-court {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .cat-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
    }
    .matchup-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .team-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .team-line.highlight {
      color: var(--accent);
      font-weight: 800;
    }
    .role-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: #dbeafe;
      color: #1e40af;
      white-space: nowrap;
    }
    .role-tag.opp {
      background: #fee2e2;
      color: #991b1b;
    }
    .vs-divider {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .group-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .group-player {
      background: #fff;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .group-player.me {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1e3a8a;
      font-weight: 800;
    }
    .note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .empty {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 20px;
      color: var(--muted);
    }
    .empty strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 4px;
    }
  </style>
</head>

      ["m","2026-11-22","17:00","5:00 PM","Court 3","MS Final","Winner of MS SF1","Winner of MS SF2",1]
    ];

    const DAY_NAMES = {
      "2026-11-20": "Fri, Nov 20",
      "2026-11-21": "Sat, Nov 21",
      "2026-11-22": "Sun, Nov 22"
    };

    const CAT_NAMES = {
      "35+ MS": "35+ Men's Singles",
      "35+ WS": "35+ Women's Singles",
      "35+ MD": "35+ Men's Doubles",
      "35+ WD": "35+ Women's Doubles",
      "35+ XD": "35+ Mixed Doubles",
      "MS": "Men's Singles",
      "WS": "Women's Singles",
      "MD": "Men's Doubles",
      "WD": "Women's Doubles",
      "XD": "Mixed Doubles"
    };

    function expandCat(raw) {
      for (const prefix of Object.keys(CAT_NAMES)) {
        if (raw === prefix || raw.startsWith(prefix + " ")) {
          const rest = raw.slice(prefix.length).trim();
          return CAT_NAMES[prefix] + (rest ? " · " + rest : "");
        }
      }
      return raw;
    }

    const EVENTS = RAW_EVENTS.map(r => {
      if (r[0] === "g") {
        return {
          type: "group",
          date: r[1],
          day: DAY_NAMES[r[1]] || r[1],
          time: r[3],
          court: r[4],
          category: expandCat(r[5]),
          players: r[6],
          note: r[7],
          isKO: false
        };
      }
      return {
        type: "match",
        date: r[1],
        day: DAY_NAMES[r[1]] || r[1],
        time: r[3],
        court: r[4],
        category: expandCat(r[5]),
        side1: r[6],
        side2: r[7],
        isKO: r[8] === 1
      };
    });

    const searchInput = document.getElementById("searchInput");
    const playerSelect = document.getElementById("playerSelect");
    const clearBtn = document.getElementById("clearBtn");
    const suggestionsEl = document.getElementById("suggestions");
    const resultsEl = document.getElementById("results");
    const summaryText = document.getElementById("summaryText");
    const countText = document.getElementById("countText");
    const dayTabs = document.getElementById("dayTabs");

    let selectedExactPlayer = "";
    let activeFilter = "ALL";

    PLAYERS.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = p;
      playerSelect.appendChild(opt);
    });

    function cleanName(name) {
      return name.replace(/\s*\(35\+\)\s*/g, "").trim();
    }

    function splitSidePlayers(sideStr) {
      if (!sideStr || sideStr.includes("Winner of") || sideStr.includes("Group Stage")) return [];
      return sideStr.split("/").map(s => cleanName(s)).filter(Boolean);
    }

    function playerMatches(playerName, q, exact) {
      const clean = cleanName(playerName);
      if (exact) return clean.toLowerCase() === exact.toLowerCase();
      if (!q) return false;
      if (clean.toLowerCase().includes(q)) return true;
      const list = ALIASES[clean] || [];
      return list.some(a => a.includes(q));
    }

    function matchesEvent(ev, q, exact) {
      if (!q && !exact) return true;
      const list = ev.type === "group"
        ? ev.players
        : [...splitSidePlayers(ev.side1), ...splitSidePlayers(ev.side2)];

      if (list.some(p => playerMatches(p, q, exact))) return true;
      if (exact) return false;

      const meta = (ev.category + " " + ev.court + " " + (ev.side1 || "") + " " + (ev.side2 || "")).toLowerCase();
      return meta.includes(q);
    }

    function sideMatches(sideStr, q, exact) {
      return splitSidePlayers(sideStr).some(p => playerMatches(p, q, exact));
    }

    function renderSuggestions(rawQ) {
      suggestionsEl.innerHTML = "";
      const q = rawQ.toLowerCase().trim();
      if (!q) return;

      const hits = PLAYERS.filter(p => playerMatches(p, q, "")).slice(0, 8);
      hits.forEach(player => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (selectedExactPlayer === player ? " active" : "");
        btn.textContent = player;
        btn.onclick = () => {
          if (selectedExactPlayer === player) {
            selectedExactPlayer = "";
            playerSelect.value = "";
          } else {
            selectedExactPlayer = player;
            searchInput.value = player;
            playerSelect.value = player;
          }
          render();
        };
        suggestionsEl.appendChild(btn);
      });
    }

    function getCardTheme(ev) {
      if (ev.type === "match" && ev.isKO && (ev.side1.includes("Winner of") || ev.side1.includes("Group Stage"))) {
        return "ko";
      }
      if (ev.date === "2026-11-20") return "fri";
      if (ev.date === "2026-11-21") return "sat";
      return "sun";
    }

    function render() {
      const rawQ = searchInput.value;
      const q = rawQ.toLowerCase().trim();
      clearBtn.classList.toggle("visible", rawQ.length > 0 || selectedExactPlayer !== "");
      renderSuggestions(rawQ);

      const list = EVENTS.filter(ev => {
        const isPlaceholder = ev.type === "match" && ev.isKO &&
          (ev.side1.includes("Winner of") || ev.side1.includes("Group Stage"));

        if (activeFilter === "KNOCKOUT") return ev.isKO;
        if (activeFilter !== "ALL" && ev.date !== activeFilter) return false;
        if ((q || selectedExactPlayer) && isPlaceholder) return false;
        return matchesEvent(ev, q, selectedExactPlayer);
      });

      if (selectedExactPlayer) {
        summaryText.textContent = "Fixtures for " + selectedExactPlayer;
      } else if (q) {
        summaryText.textContent = 'Search results for "' + rawQ.trim() + '"';
      } else if (activeFilter === "KNOCKOUT") {
        summaryText.textContent = "Knockout stage brackets & timings";
      } else {
        summaryText.textContent = "All scheduled fixtures (type or select a name above)";
      }
      countText.textContent = list.length + (list.length === 1 ? " fixture" : " fixtures");

      resultsEl.innerHTML = "";
      if (list.length === 0) {
        resultsEl.innerHTML = `
          <div class="empty">
            <strong>No fixtures found</strong>
            Try another spelling, select a name from the dropdown, or switch day tabs.
          </div>`;
        return;
      }

      list.forEach(ev => {
        const theme = getCardTheme(ev);
        const card = document.createElement("article");
        card.className = "card " + theme;

        let bodyHtml = "";
        if (ev.type === "group") {
          const hasSearch = Boolean(q || selectedExactPlayer);
          const opponents = hasSearch
            ? ev.players.filter(p => !playerMatches(p, q, selectedExactPlayer))
            : [];
          const oppLine = opponents.length
            ? `<div class="note">⚔️ <strong>Group Opponents:</strong> ${opponents.join(", ")}</div>`
            : "";

          const pills = ev.players.map(p => {
            const isMe = hasSearch && playerMatches(p, q, selectedExactPlayer);
            return `<span class="group-player ${isMe ? "me" : ""}">${p}</span>`;
          }).join("");

          bodyHtml = `
            <div class="matchup-box">
              <div class="vs-divider">Group Players (Round-Robin)</div>
              <div class="group-list">${pills}</div>
            </div>
            ${oppLine}
            <div class="note">ℹ️ ${ev.note}</div>
          `;
        } else {
          const hasSearch = Boolean(q || selectedExactPlayer);
          const s1Match = sideMatches(ev.side1, q, selectedExactPlayer);
          const s2Match = sideMatches(ev.side2, q, selectedExactPlayer);

          const s1Tag = hasSearch ? (s1Match ? '<span class="role-tag">Your Team</span>' : (s2Match ? '<span class="role-tag opp">Opponent</span>' : "")) : "";
          const s2Tag = hasSearch ? (s2Match ? '<span class="role-tag">Your Team</span>' : (s1Match ? '<span class="role-tag opp">Opponent</span>' : "")) : "";

          bodyHtml = `
            <div class="matchup-box">
              <div class="team-line ${s1Match ? "highlight" : ""}">
                <span>${ev.side1}</span>
                ${s1Tag}
              </div>
              <div class="vs-divider">VS</div>
              <div class="team-line ${s2Match ? "highlight" : ""}">
                <span>${ev.side2}</span>
                ${s2Tag}
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-top">
            <div class="badges">
              <span class="badge badge-${theme}">${ev.day} · ${ev.time}</span>
            </div>
            <span class="badge-court">🏸 ${ev.court}</span>
          </div>
          <div class="cat-title">${ev.category}</div>
          ${bodyHtml}
        `;
        resultsEl.appendChild(card);
      });
    }

    searchInput.addEventListener("input", () => {
      selectedExactPlayer = "";
      playerSelect.value = "";
      render();
    });

    playerSelect.addEventListener("change", () => {
      selectedExactPlayer = playerSelect.value;
      searchInput.value = playerSelect.value;
      render();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      selectedExactPlayer = "";
      playerSelect.value = "";
      searchInput.focus();
      render();
    });

    dayTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      render();
    });

    render();
  </script>
